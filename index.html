<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio Link</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-image: url('bg.png');
            --bg-color: #050505;
            --gradient-start: #ff3b3b;
            --gradient-end: #ff8c00;
            --card-bg: rgba(15, 5, 5, 0.55);
            --card-border: rgba(255, 26, 26, 0.2);
            --card-border-hover: rgba(255, 26, 26, 0.6);
            --text-main: #ffffff;
            --text-muted: #cfabab;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-image: linear-gradient(rgba(5, 5, 5, 0.65), rgba(5, 5, 5, 0.65)), var(--bg-image);
            background-size: 115% 150vh;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: scroll;
            background-color: var(--bg-color);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.65);
            z-index: 1;
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .avatar-wrapper {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 24px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--card-border);
            background: #1a0505;
        }

        .username-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
        }

        .username {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .bio {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .links-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-item {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .link-item svg {
            width: 20px;
            height: 20px;
            margin-right: 12px;
            fill: var(--text-muted);
            transition: fill 0.25s ease;
        }

        .link-item:hover {
            background: rgba(255, 26, 26, 0.05);
            border-color: var(--card-border-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(255, 26, 26, 0.15);
            color: var(--text-main);
        }

        .link-item:hover svg {
            fill: #ff1a1a;
        }

        .link-item:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="avatar-wrapper">
            <img class="avatar" src="avat.jpg" alt="Avatar">
        </div>

        <div class="username-container">
            <h1 class="username">vazyann</h1>
        </div>

        <p class="bio">тестирую с созданием профиля</p>

        <div class="links-list">
            <a href="https://t.me/nz0xt" target="_blank" class="link-item">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.11.02-1.93 1.23-5.46 3.62-.51.35-.98.53-1.39.51-.46-.01-1.35-.26-2.01-.48-.81-.27-1.46-.42-1.4-.88.03-.24.36-.49.99-.75 3.88-1.69 6.46-2.8 7.74-3.32 3.69-1.5 4.45-1.76 4.95-1.77.11 0 .36.03.52.16.13.11.17.27.18.38.01.07.02.22.01.37z"/>
                </svg>
                Telegram
            </a>
        </div>
    </div>

</body>
</html>
