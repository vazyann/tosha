<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>vazyann bio</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-image: url('bg.png');
            --bg-color: #050505;
            --gradient-start: #ff3b3b;
            --gradient-end: #ff8c00;
            --card-bg: rgba(15, 5, 5, 0.55);
            --card-border: rgba(255, 26, 26, 0.2);
            --card-border-hover: rgba(255, 26, 26, 0.6);
            --text-main: #ffffff;
            --text-muted: #cfabab;
            --player-accent: #ff3b3b;
            --player-accent-glow: rgba(255, 59, 59, 0.4);
            --player-line: rgba(255, 26, 26, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-image: linear-gradient(rgba(5, 5, 5, 0.65), rgba(5, 5, 5, 0.65)), var(--bg-image);
            background-size: 115% 150vh;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: scroll;
            background-color: var(--bg-color);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        #intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            cursor: pointer;
            transition: opacity 0.5s ease, visibility 0.5s;
        }

        #intro-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .intro-text {
            font-family: 'Outfit', sans-serif;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 4px;
            color: #ffffff;
            text-transform: uppercase;
            animation: pulse 1.8s infinite ease-in-out;
            text-shadow: 0 0 10px rgba(255, 59, 59, 0.5);
        }

        @keyframes pulse {
            0% { opacity: 0.3; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1); }
            100% { opacity: 0.3; transform: scale(0.98); }
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.65);
            z-index: 1;
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .avatar-wrapper {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 24px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--card-border);
            background: #1a0505;
        }

        .username-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
        }

        .username {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .bio {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .links-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-item {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .link-item svg {
            width: 20px;
            height: 20px;
            margin-right: 12px;
            fill: var(--text-muted);
            transition: fill 0.25s ease;
        }

        .link-item:hover {
            background: rgba(255, 26, 26, 0.05);
            border-color: var(--card-border-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(255, 26, 26, 0.15);
            color: var(--text-main);
        }

        .link-item:hover svg {
            fill: #ff1a1a;
        }

        .link-item:active {
            transform: translateY(0);
        }

        .advanced-player {
            margin-top: 35px;
            padding-top: 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            text-align: left;
        }

        .track-info {
            font-family: 'Outfit', sans-serif;
            font-size: 15px;
            color: var(--text-main);
            font-weight: 600;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
            text-shadow: 0 0 10px rgba(255, 59, 59, 0.2);
        }

        .player-controls-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .time-stamp {
            font-family: 'Outfit', sans-serif;
            font-size: 11px;
            color: var(--text-muted);
            min-width: 35px;
            font-weight: 600;
            opacity: 0.8;
        }

        .progress-bar-container {
            flex-grow: 1;
            height: 14px;
            display: flex;
            align-items: center;
            position: relative;
            cursor: pointer;
        }

        .progress-bar-bg {
            width: 100%;
            height: 4px;
            background: var(--player-line);
            border-radius: 4px;
            position: relative;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--gradient-start), var(--gradient-end));
            border-radius: 4px;
            box-shadow: 0 0 8px var(--player-accent-glow);
        }

        .buttons-group {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-left: 6px;
        }

        .player-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .player-btn svg {
            width: 14px;
            height: 14px;
            fill: var(--text-muted);
            transition: fill 0.2s, filter 0.2s;
        }

        .player-btn:hover svg {
            fill: var(--player-accent);
            filter: drop-shadow(0 0 4px var(--player-accent-glow));
        }

        .player-btn.main-toggle svg {
            width: 18px;
            height: 18px;
            fill: var(--text-main);
        }

        .player-btn.main-toggle:hover svg {
            fill: var(--player-accent);
        }
    </style>
</head>
<body>

    <div id="intro-overlay">
        <div class="intro-text">presssssssssssss enterr</div>
    </div>

    <audio id="audio-track" src="track.mp3" preload="metadata"></audio>

    <div class="container">
        <div class="avatar-wrapper">
            <img class="avatar" src="avat.jpg" alt="Avatar">
        </div>

        <div class="username-container">
            <h1 class="username">vazyann</h1>
        </div>

        <p class="bio">тестирую с созданием профиля</p>

        <div class="links-list">
            <a href="https://t.me" target="_blank" class="link-item">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.11.02-1.93 1.23-5.46 3.62-.51.35-.98.53-1.39.51-.46-.01-1.35-.26-2.01-.48-.81-.27-1.46-.42-1.4-.88.03-.24.36-.49.99-.75 3.88-1.69 6.46-2.8 7.74-3.32 3.69-1.5 4.45-1.76 4.95-1.77.11 0 .36.03.52.16.13.11.17.27.18.38.01.07.02.22.01.37z"/>
                </svg>
                Telegram
            </a>
        </div>

        <div class="advanced-player">
            <div class="track-info" id="track-title">onda andar - prop hunt</div>
            <div class="player-controls-row">
                <div class="time-stamp" id="current-time">0:00</div>
                
                <div class="progress-bar-container" id="progress-container">
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" id="progress-fill"></div>
                    </div>
                </div>
                
                <div class="time-stamp" id="duration-time">0:00</div>
                
                <div class="buttons-group">
                    <button class="player-btn main-toggle" id="play-btn">
                        <svg id="play-icon" viewBox="0 0 24 24"><path id="svg-path" d="M8 5v14l11-7z"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const audio = document.getElementById('audio-track');
        const playBtn = document.getElementById('play-btn');
        const svgPath = document.getElementById('svg-path');
        const progressContainer = document.getElementById('progress-container');
        const progressFill = document.getElementById('progress-fill');
        const currentTimeEl = document.getElementById('current-time');
        const durationTimeEl = document.getElementById('duration-time');
        const introOverlay = document.getElementById('intro-overlay');

        const playPath = "M8 5v14l11-7z";
        const pausePath = "M6 19h4V5H6v14zm8-14v14h4V5h-4z";

        function formatTime(seconds) {
            if (isNaN(seconds) || seconds === Infinity || seconds < 0) return "0:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function updateDurationDisplay() {
            if (audio.duration) {
                durationTimeEl.textContent = formatTime(audio.duration);
            }
        }

        introOverlay.addEventListener('click', () => {
            introOverlay.classList.add('hidden');
            audio.play()
                .then(() => {
                    svgPath.setAttribute('d', pausePath);
                    updateDurationDisplay();
                })
                .catch(err => console.log("Ошибка автозапуска:", err));
        });

        playBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                svgPath.setAttribute('d', pausePath);
                updateDurationDisplay();
            } else {
                audio.pause();
                svgPath.setAttribute('d', playPath);
            }
        });

        audio.addEventListener('loadedmetadata', updateDurationDisplay);
        audio.addEventListener('durationchange', updateDurationDisplay);
        audio.addEventListener('playing', updateDurationDisplay);

        audio.addEventListener('timeupdate', () => {
            if (!isRewinding) {
                const percentage = (audio.currentTime / audio.duration) * 100;
                progressFill.style.width = isNaN(percentage) ? '0%' : `${percentage}%`;
                currentTimeEl.textContent = formatTime(audio.currentTime);
            }
        });

        audio.addEventListener('ended', () => {
            audio.currentTime = 0;
            audio.play()
                .then(() => {
                    svgPath.setAttribute('d', pausePath);
                })
                .catch(err => {
                    svgPath.setAttribute('d', playPath);
                    progressFill.style.width = '0%';
                    currentTimeEl.textContent = "0:00";
                });
        });

        let isRewinding = false;

        function setProgress(e) {
            if (!audio.duration) return;
            
            const rect = progressContainer.getBoundingClientRect();
            let clientX;
            
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches.clientX;
            } else if (e.changedTouches && e.changedTouches.length > 0) {
                clientX = e.changedTouches.clientX;
            } else {
                clientX = e.clientX;
            }
            
            let clickX = clientX - rect.left;
            let width = rect.width;
            let percentage = (clickX / width) * 100;
            
            if (percentage < 0) percentage = 0;
            if (percentage > 100) percentage = 100;
            
            progressFill.style.width = `${percentage}%`;
            
            const newTime = (percentage / 100) * audio.duration;
            currentTimeEl.textContent = formatTime(newTime);
            
            return newTime;
        }

        progressContainer.addEventListener('mousedown', (e) => {
            isRewinding = true;
            const newTime = setProgress(e);
            if(newTime !== undefined) audio.currentTime = newTime;
        });

        window.addEventListener('mousemove', (e) => {
            if (isRewinding) setProgress(e);
        });

        window.addEventListener('mouseup', (e) => {
            if (isRewinding) {
                isRewinding = false;
                const newTime = setProgress(e);
                if(newTime !== undefined) audio.currentTime = newTime;
            }
        });

        progressContainer.addEventListener('touchstart', (e) => {
            isRewinding = true;
            setProgress(e);
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (isRewinding) setProgress(e);
        }, { passive: true });

        window.addEventListener('touchend', (e) => {
            if (isRewinding) {
                isRewinding = false;
                const newTime = setProgress(e);
                if(newTime !== undefined) audio.currentTime = newTime;
            }
        });
    </script>
</body>
</html>
